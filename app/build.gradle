plugins {
    id 'com.android.application'
}

android {
    namespace 'lv.dimy.eunlwidget'
    compileSdk 35

    defaultConfig {
        applicationId 'lv.dimy.eunlwidget'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '1.3'
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }
}
